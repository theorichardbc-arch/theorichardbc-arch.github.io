<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lbClose">✕ FERMER</button>
  <button class="lightbox-nav lightbox-prev" id="lbPrev">←</button>
  <div class="lb-photo-wrapper">
    <img src="" alt="" id="lbImg">
    <div class="lb-info" id="lbInfo">
      <p class="lb-info-titre" id="lbTitre"></p>
      <p class="lb-info-corps" id="lbCorps"></p>
    </div>
  </div>
  <button class="lightbox-nav lightbox-next" id="lbNext">→</button>
  <div class="lightbox-counter" id="lbCounter"></div>
  <div class="lightbox-actions">
    <button class="lb-action-btn" id="lbCopier">Copier le lien</button>
    <a      class="lb-action-btn" id="lbMail" href="#">Envoyer par mail</a>
    <a      class="lb-action-btn" id="lbDl"   href="#">Télécharger</a>
    <a      class="lb-action-btn" href="contact.html">Répondre à cette photo</a>
  </div>
</div>

<footer class="site-footer">

  <span><a href="mentions.html">Mentions légales</a></span>
</footer>

<script>
  document.getElementById('annee').textContent = new Date().getFullYear();

  var allItems  = Array.from(document.querySelectorAll('.photo-item img'));
  var lightbox  = document.getElementById('lightbox');
  var lbImg     = document.getElementById('lbImg');
  var lbClose   = document.getElementById('lbClose');
  var lbPrev    = document.getElementById('lbPrev');
  var lbNext    = document.getElementById('lbNext');
  var lbCounter = document.getElementById('lbCounter');
  var lbCopier  = document.getElementById('lbCopier');
  var lbMail    = document.getElementById('lbMail');
  var lbDl      = document.getElementById('lbDl');
  var current   = 0;

  function updateActions() {
    var img   = allItems[current];
    var titre = img.getAttribute('data-titre') || '';
    var info  = img.getAttribute('data-info')  || '';
    document.getElementById('lbTitre').textContent = titre;
    document.getElementById('lbCorps').innerHTML   = info.replace(/\n/g, '<br>');
    document.getElementById('lbInfo').style.opacity = (titre || info) ? '1' : '0';
  }

  function alignInfo() {
    var src  = allItems[current].src;
    var alt  = allItems[current].alt || 'Photo';
    var pageUrl = window.location.href.split('#')[0];
    lbMail.href = 'mailto:?subject=' + encodeURIComponent('Une photo de Théo Richard') +
                  '&body=' + encodeURIComponent('Regarde cette photo : "' + alt + '"\n' + pageUrl);
    lbDl.onclick = function(e) {
      e.preventDefault();
      fetch(src)
        .then(function(r) { return r.blob(); })
        .then(function(blob) {
          var bUrl = URL.createObjectURL(blob);
          var a = document.createElement('a');
          a.href = bUrl;
          a.download = alt.toLowerCase().replace(/\s+/g, '-').replace(/[^a-z0-9-]/g, '') + '.jpg';
          a.click();
          URL.revokeObjectURL(bUrl);
        })
        .catch(function() { window.open(src, '_blank'); });
    };
  }

  function openLightbox(index) {
    current = index;
    lbImg.src = allItems[current].src;
    lbImg.onload = function() { alignInfo(); };
    lbCounter.textContent = (current + 1) + ' / ' + allItems.length;
    updateActions();
    lightbox.classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeLightbox() {
    lightbox.classList.remove('open');
    document.body.style.overflow = '';
  }

  function navigate(dir) {
    current = (current + dir + allItems.length) % allItems.length;
    lbImg.style.opacity = 0;
    setTimeout(function() {
      lbImg.src = allItems[current].src;
      lbImg.onload = function() { alignInfo(); };
      lbCounter.textContent = (current + 1) + ' / ' + allItems.length;
      updateActions();
      lbImg.style.opacity = 1;
    }, 140);
  }

  lbImg.style.transition = 'opacity 0.14s ease';

  allItems.forEach(function(img, i) {
    img.closest('.photo-item').addEventListener('click', function() { openLightbox(i); });
  });

  lbClose.addEventListener('click', closeLightbox);
  lbPrev.addEventListener('click',  function() { navigate(-1); });
  lbNext.addEventListener('click',  function() { navigate(1); });
  lightbox.addEventListener('click', function(e) { if (e.target === lightbox) closeLightbox(); });

  document.addEventListener('keydown', function(e) {
    if (!lightbox.classList.contains('open')) return;
    if (e.key === 'Escape')     closeLightbox();
    if (e.key === 'ArrowLeft')  navigate(-1);
    if (e.key === 'ArrowRight') navigate(1);
  });

  lbCopier.addEventListener('click', function() {
    navigator.clipboard.writeText(window.location.href.split('#')[0]).then(function() {
      lbCopier.textContent = 'Lien copié !';
      lbCopier.classList.add('copied');
      setTimeout(function() {
        lbCopier.textContent = 'Copier le lien';
        lbCopier.classList.remove('copied');
      }, 2000);
    });
  });

  // Chargement progressif
  var photoObserver = new IntersectionObserver(function(entries) {
    entries.forEach(function(entry) {
      if (entry.isIntersecting) {
        entry.target.classList.add('loaded');
        photoObserver.unobserve(entry.target);
      }
    });
  }, { threshold: 0.1 });

  allItems.forEach(function(img, i) {
    img.style.transitionDelay = ((i % 3) * 80) + 'ms';
    photoObserver.observe(img);
  });
</script>
