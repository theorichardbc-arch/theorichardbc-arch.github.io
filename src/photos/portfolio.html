---
titre: Portfolio — Théo Richard
description: Portfolio de Théo Richard : photographies argentiques noir et blanc.
---
<div class="page-wrapper">

<div class="photo-grid-page">

  <div class="section-page-heading">
    <h1>Portfolio</h1>
  </div>

  <div class="portfolio-meta">
    <p class="photo-qualite-mention">
      Images optimisées pour le web — <a href="../prestations/prestations.html#tirages-art">voir les options de tirage</a>
    </p>
    <p class="photo-archive-note">
      Portfolio mis à jour régulièrement — <a href="archives.html">voir les photos archivées</a>
    </p>
  </div>

  <div class="masonry-grid">
<!-- @auto:photos -->
  </div>
</div>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photographie en plein écran" tabindex="-1">
  <button class="lightbox-close" id="lbClose" type="button" aria-label="Fermer la photographie">✕ FERMER</button>
  <button class="lightbox-nav lightbox-prev" id="lbPrev" type="button" aria-label="Photographie précédente">←</button>
  <div class="lb-photo-wrapper">
    <img src="" alt="Photographie de Théo Richard" id="lbImg">
    <div class="lb-info" id="lbInfo">
      <p class="lb-info-titre" id="lbTitre"></p>
      <p class="lb-info-corps" id="lbCorps"></p>
    </div>
  </div>
  <button class="lightbox-nav lightbox-next" id="lbNext" type="button" aria-label="Photographie suivante">→</button>
  <div class="lightbox-counter" id="lbCounter" aria-live="polite"></div>
  <div class="lightbox-actions">
    <button class="lb-action-btn" id="lbCopier" type="button" aria-live="polite">Copier le lien</button>
    <a class="lb-action-btn" id="lbMail" href="mailto:contact@theo-richard.fr">M’écrire au sujet de cette photo</a>
  </div>
</div>

</div>

<script>
  var allItems  = Array.from(document.querySelectorAll('.photo-item img'));
  var lightbox  = document.getElementById('lightbox');
  var lbImg     = document.getElementById('lbImg');
  var lbClose   = document.getElementById('lbClose');
  var lbPrev    = document.getElementById('lbPrev');
  var lbNext    = document.getElementById('lbNext');
  var lbCounter = document.getElementById('lbCounter');
  var lbCopier  = document.getElementById('lbCopier');
  var lbMail    = document.getElementById('lbMail');
  var current   = 0;
  var openerPhoto = null;
  var previousBodyOverflow = '';

  allItems.forEach(function(img, i) {
    var photo = img.closest('.photo-item');
    photo.id = 'photo-' + (i + 1);
    photo.setAttribute('role', 'button');
    photo.setAttribute('tabindex', '0');
    photo.setAttribute('aria-label', 'Agrandir la photographie : ' + (img.getAttribute('data-titre') || img.alt || 'sans titre'));
  });

  function fullImageSource(img) {
    return img.getAttribute('data-fullsrc') || img.src;
  }

  function photoUrl(index) {
    return window.location.href.split('#')[0] + '#photo-' + (index + 1);
  }

  function updateActions() {
    var img   = allItems[current];
    var titre = img.getAttribute('data-titre') || '';
    var info  = img.getAttribute('data-info')  || '';
    lbImg.alt = img.alt || titre || 'Photographie de Théo Richard';
    document.getElementById('lbTitre').textContent = titre;
    document.getElementById('lbCorps').innerHTML   = info.replace(/\n/g, '<br>');
    document.getElementById('lbInfo').style.opacity = (titre || info) ? '1' : '0';
    lbMail.href = 'mailto:contact@theo-richard.fr?subject=' +
      encodeURIComponent('À propos de la photo « ' + (titre || 'sans titre') + ' »') +
      '&body=' + encodeURIComponent('Bonjour Théo,\n\nJe vous écris au sujet de cette photo : ' + photoUrl(current));
  }

  function openLightbox(index, opener) {
    current = index;
    openerPhoto = opener || null;
    previousBodyOverflow = document.body.style.overflow;
    lbImg.src = fullImageSource(allItems[current]);
    lbCounter.textContent = (current + 1) + ' / ' + allItems.length;
    updateActions();
    lightbox.classList.add('open');
    document.body.style.overflow = 'hidden';
    lbClose.focus();
  }

  function closeLightbox() {
    lightbox.classList.remove('open');
    document.body.style.overflow = previousBodyOverflow;
    if (openerPhoto) openerPhoto.focus();
  }

  function navigate(dir) {
    current = (current + dir + allItems.length) % allItems.length;
    lbImg.style.opacity = 0;
    setTimeout(function() {
      lbImg.src = fullImageSource(allItems[current]);
      lbCounter.textContent = (current + 1) + ' / ' + allItems.length;
      updateActions();
      lbImg.style.opacity = 1;
    }, 140);
  }

  lbImg.style.transition = 'opacity 0.14s ease';

  allItems.forEach(function(img, i) {
    var photo = img.closest('.photo-item');
    photo.addEventListener('click', function() { openLightbox(i, photo); });
    photo.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        openLightbox(i, photo);
      }
    });
  });

  lbClose.addEventListener('click', closeLightbox);
  lbPrev.addEventListener('click',  function() { navigate(-1); });
  lbNext.addEventListener('click',  function() { navigate(1); });
  lightbox.addEventListener('click', function(e) { if (e.target === lightbox) closeLightbox(); });

  document.addEventListener('keydown', function(e) {
    if (!lightbox.classList.contains('open')) return;
    if (e.key === 'Escape')     closeLightbox();
    if (e.key === 'ArrowLeft')  navigate(-1);
    if (e.key === 'ArrowRight') navigate(1);
    if (e.key === 'Tab') {
      var focusable = Array.from(lightbox.querySelectorAll('button:not([disabled]), a[href]'));
      var first = focusable[0];
      var last = focusable[focusable.length - 1];
      if (e.shiftKey && document.activeElement === first) {
        e.preventDefault();
        last.focus();
      } else if (!e.shiftKey && document.activeElement === last) {
        e.preventDefault();
        first.focus();
      }
    }
  });

  lbCopier.addEventListener('click', function() {
    if (!navigator.clipboard || !navigator.clipboard.writeText) {
      lbCopier.textContent = 'Copie indisponible';
      return;
    }
    Promise.resolve().then(function() {
      return navigator.clipboard.writeText(photoUrl(current));
    }).then(function() {
      lbCopier.textContent = 'Lien copié !';
      lbCopier.classList.add('copied');
      setTimeout(function() {
        lbCopier.textContent = 'Copier le lien';
        lbCopier.classList.remove('copied');
      }, 2000);
    }).catch(function() {
      lbCopier.textContent = 'Copie impossible';
    });
  });

  function openPhotoFromHash() {
    var photoMatch = window.location.hash.match(/^#photo-(\d+)$/);
    if (!photoMatch) return;
    var photoIndex = Number(photoMatch[1]) - 1;
    if (photoIndex >= 0 && photoIndex < allItems.length) {
      openLightbox(photoIndex);
    }
  }

  window.addEventListener('hashchange', openPhotoFromHash);
  openPhotoFromHash();

  allItems.forEach(function(img) {
    img.addEventListener('load', function() {
      img.classList.add('loaded');
    });
    if (img.complete && img.naturalWidth) img.classList.add('loaded');
  });
</script>
