<script>
  document.getElementById('annee').textContent = new Date().getFullYear();
  var toggleSwitch = document.querySelector('#checkbox-theme');
  var saved = localStorage.getItem('theme');
  if (saved) { document.documentElement.setAttribute('data-theme', saved); if (saved === 'dark' && toggleSwitch) toggleSwitch.checked = true; }
  if (toggleSwitch) {
    toggleSwitch.addEventListener('change', function(e) {
      var t = e.target.checked ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
      localStorage.setItem('theme', t);
    });
  }
  var hBtn = document.getElementById('hamburgerBtn');
  var mOv  = document.getElementById('mobileOverlay');
  if (hBtn && mOv) {
    hBtn.addEventListener('click', function() {
      var isOpen = mOv.classList.toggle('open');
      hBtn.classList.toggle('open', isOpen);
      hBtn.setAttribute('aria-expanded', String(isOpen));
      document.body.style.overflow = isOpen ? 'hidden' : '';
    });
  }
  var stBtn = document.getElementById('scrollTopBtn');
  if (stBtn) {
    window.addEventListener('scroll', function() { stBtn.classList.toggle('visible', window.scrollY > 300); });
    stBtn.addEventListener('click', function() { window.scrollTo({ top: 0, behavior: 'smooth' }); });
    var footer = document.querySelector('.site-footer');
    if (footer) new IntersectionObserver(function(entries) {
      stBtn.classList.toggle('footer-visible', entries[0].isIntersecting);
    }).observe(footer);
  }
</script>
