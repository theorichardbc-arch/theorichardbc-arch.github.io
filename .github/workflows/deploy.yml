name: Construire et publier le site

# À chaque push et chaque pull request : le site est construit et contrôlé.
# Seule la branche main est publiée sur GitHub Pages, et seulement si les contrôles bloquants passent.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # historique complet : dates de dernière modification du sitemap

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les outils
        run: npm ci

      - name: Construire le site (pages, miniatures) et valider les fichiers JSON
        run: node scripts/build.mjs

      - name: Fabriquer et vérifier le PDF des tarifs
        run: |
          sudo apt-get install -y --no-install-recommends poppler-utils
          node scripts/pdf-tarifs.mjs

      - name: Contrôler le site (liens, images, titres, alt, doublons)
        run: node scripts/controler.mjs

      - name: Résumé des contrôles
        if: always()
        run: node scripts/resume.mjs

      - name: Aperçu du PDF des tarifs (à relire)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apercu-pdf-tarifs
          path: .controles/apercu-tarifs
          if-no-files-found: ignore

      - name: Préparer l'archive Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publier:
    if: github.ref == 'refs/heads/main'
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
